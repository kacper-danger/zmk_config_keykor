manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    # Cirque Pinnacle driver (ZMK v0.3 / Zephyr 3.5 has no in-tree driver).
    # Needs its own revision: the default v0.3 tag does not exist in this repo.
    - name: cirque-input-module
      remote: petejohanson
      revision: main
  self:
    path: config
