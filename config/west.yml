manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: nxtkb
      url-base: https://github.com/nxtkb
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Fork of petejohanson/cirque-input-module (edge scroll, taps, runtime speed keys).
    # Uses compatible "cirque,pinnacle2" so it does not clash with Zephyr's in-tree "cirque,pinnacle".
    - name: cirque-input-module
      remote: nxtkb
      revision: main
  self:
    path: config
